<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://wmts.geo.admin.ch https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D2B2F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sortaties">
<title>Sortaties</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="mapwrap">
    <div id="map" aria-label="Carte des sorties"></div>
    <div class="basemaps" id="basemaps" role="group" aria-label="Fond de carte"></div>

    <section class="card" id="card" hidden aria-labelledby="cardName">
      <div class="sign">
        <span class="sign-name" id="cardName"></span>
        <span class="sign-time" id="cardTime"></span>
      </div>
      <button class="close" id="cardClose" type="button" aria-label="Fermer la fiche">×</button>
      <p class="card-when" id="cardWhen"></p>
      <dl class="card-stats" id="cardStats"></dl>
      <details class="card-more" id="cardMore">
        <summary>Plus de stats</summary>
        <dl class="card-stats" id="cardMoreStats"></dl>
      </details>
    </section>
  </main>

  <aside class="panel" aria-label="Sorties">
    <header class="head">
      <h1>Sortaties</h1>
      <div id="recap"></div>
      <div class="actions">
        <label class="btn primary" for="dirInput"><span id="dirLabel">Dossier d’une personne</span></label>
        <input class="file" type="file" id="dirInput" webkitdirectory multiple>
        <label class="btn" for="fileInput">Choisir des fichiers</label>
        <input class="file" type="file" id="fileInput" multiple>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </header>

    <div class="filters" id="filters" hidden>
      <div class="chips" id="people" role="group" aria-label="Filtrer par personne"></div>
      <div class="selects">
        <label class="year">Année
          <select id="year"><option value="">Toutes</option></select>
        </label>
        <label class="year">Catégorie
          <select id="cat"><option value="">Toutes</option></select>
        </label>
      </div>
    </div>

    <details class="more" id="more" hidden>
      <summary>Records et stats</summary>
      <div id="stats"></div>
    </details>

    <ol class="list" id="list"></ol>

    <footer class="foot">
      <p>Rien n’est envoyé : les fichiers sont lus sur cet appareil.</p>
      <button class="linkbtn" id="clear" type="button" hidden>Tout effacer de cet appareil</button>
    </footer>
  </aside>
</div>
<script src="leaflet.js"></script>
<script src="nage-api.js"></script>
<script src="rando-ski-api.js"></script>
<script src="app.js"></script>
</body>
</html>
